name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        env:
          AGENTFLOW_MACHINE_STATE_DIR: ${{ runner.temp }}/agentflow-machine
          PYTHONUTF8: "1"
        run: python -m unittest discover -s .agentflow/tests

  package:
    name: package integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and exercise wheel/sdist in disposable venvs
        env:
          AGENTFLOW_MACHINE_STATE_DIR: ${{ runner.temp }}/agentflow-machine
          PYTHONUTF8: "1"
        run: python .agentflow/tests/check_package.py

  mcp:
    name: mcp integration (${{ matrix.os }})
    needs: tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Provision the optional mcp SDK and exercise a real stdio session
        env:
          AGENTFLOW_MACHINE_STATE_DIR: ${{ runner.temp }}/agentflow-machine
          PYTHONUTF8: "1"
        run: python .agentflow/tests/check_mcp.py
